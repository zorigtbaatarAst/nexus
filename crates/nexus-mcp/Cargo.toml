[package]
name = "nexus-mcp"
description = "MCP server. A thin adapter over nexus-core's Engine — no business logic lives here."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-core.workspace = true
cap-bughunter.workspace = true
cap-architect.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
