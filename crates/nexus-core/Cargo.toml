[package]
name = "nexus-core"
description = "The Engine: all BugHunter business logic. Knows nothing of MCP, the CLI, or any AI provider."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-types.workspace = true
nexus-store.workspace = true
nexus-vcs.workspace = true
nexus-verify.workspace = true
nexus-lang.workspace = true
blake3.workspace = true
ignore.workspace = true
rayon.workspace = true
# Derive-only, so the platform's finding contract can describe itself to an agent.
# Not an adapter and not an AI provider, so the boundary rules are untouched.
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Reads .nexus/policy.toml. Not an adapter and not a network stack, so the boundary
# rules are untouched — tests/boundaries.rs checks for HTTP clients, not for parsers.
toml.workspace = true

[dev-dependencies]
nexus-verify.workspace = true
# The core does not ship with analyzers, but its own tests need a project that indexes.
# A dev-dependency, which `cargo metadata --no-deps` reports separately and the boundary
# test therefore ignores — the rule is about what the platform *is*, not what it is tested
# with.
nexus-lang-pack.workspace = true
