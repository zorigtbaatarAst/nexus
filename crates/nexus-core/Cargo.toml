[package]
name = "nexus-core"
description = "The Engine: all BugHunter business logic. Knows nothing of MCP, the CLI, or any AI provider."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-types.workspace = true
nexus-store.workspace = true
nexus-vcs.workspace = true
nexus-verify.workspace = true
nexus-lang.workspace = true
nexus-lang-java.workspace = true
nexus-lang-ts.workspace = true
nexus-lang-graphql.workspace = true
blake3.workspace = true
ignore.workspace = true
rayon.workspace = true
# Derive-only, so the platform's finding contract can describe itself to an agent.
# Not an adapter and not an AI provider, so the boundary rules are untouched.
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Reads .nexus/policy.toml. Not an adapter and not a network stack, so the boundary
# rules are untouched — tests/boundaries.rs checks for HTTP clients, not for parsers.
toml.workspace = true

[dev-dependencies]
nexus-verify.workspace = true
