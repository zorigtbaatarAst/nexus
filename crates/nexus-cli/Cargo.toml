[package]
name = "nexus-cli"
description = "The bughunter binary: CLI and (from V1) MCP server. Composition root."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Two binaries, one crate. `nexus` is the platform; `bughunter` is the capability's own
# CLI, kept so BugHunter stays usable on its own. Which one is running is decided by
# argv[0], so there is one dispatch path rather than two that drift.
[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "bughunter"
path = "src/main.rs"

[dependencies]
nexus-core.workspace = true
cap-bughunter.workspace = true
cap-architect.workspace = true
nexus-mcp.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
nexus-types.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
