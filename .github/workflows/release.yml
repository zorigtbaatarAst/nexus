name: Release

# install.sh downloads release assets and verifies their checksums, so every tag
# must publish both. Doing it here rather than by hand keeps that guarantee.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds target musl, so the binary is fully static and runs on any
          # distribution regardless of its glibc version. That is what makes
          # "download it and run it" true rather than nearly true.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: nexus-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: nexus-linux-aarch64
          # Both macOS assets are built on Apple Silicon. GitHub is retiring the Intel
          # macos-13 runners, and a job requesting one simply waits forever for a runner
          # that is never assigned — a failure with no error message. Xcode ships both
          # SDKs, so an arm64 runner cross-compiles the Intel binary natively.
          - os: macos-14
            target: aarch64-apple-darwin
            asset: nexus-macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: nexus-macos-x86_64
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The bundled SQLite and libgit2 are C, so a musl target needs a musl C compiler.
      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/nexus"
          file "$bin"

          # A cross-compiled binary cannot be executed here: Rosetta is not installed on
          # the arm64 runners. `file` still proves the architecture is right.
          if [ "${{ matrix.cross || false }}" = "true" ]; then
            file "$bin" | grep -q "x86_64" || { echo "wrong architecture"; exit 1; }
          else
            "$bin" --version
          fi
          if [ "${{ contains(matrix.target, 'musl') }}" = "true" ]; then
            # A dynamically linked "static" build works on the runner and fails on a
            # user's machine, which is the worst possible time to find out.
            #
            # Assert on the absence of shared-library lines rather than on ldd's wording:
            # it prints "not a dynamic executable" on some systems and "statically linked"
            # on others for the very same static-PIE binary, so matching either string
            # fails on whichever runner happens to disagree.
            if ldd "$bin" 2>&1 | grep -q '=>'; then
              echo "musl build links shared libraries:"; ldd "$bin"; exit 1
            fi
            echo "static: no shared library dependencies"
          fi

      - name: Stage the asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nexus" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          mkdir -p dist && cp staging/nexus-* dist/
          chmod +x dist/nexus-*
          cd dist && sha256sum nexus-* > checksums.txt
          cat checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ github.event.inputs.tag || github.ref_name }}"

          # Anything below 1.0 is published as a pre-release. Bug detection, verification
          # and the MCP server are still V1, and a plain "release" would overstate that to
          # anyone who finds the repository.
          prerelease=""
          case "$version" in v0.*) prerelease="--prerelease" ;; esac

          # Re-running a release must update its assets rather than fail.
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/* --clobber
          else
            gh release create "$version" dist/* $prerelease \
              --title "Nexus $version" \
              --notes "Install:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Then:

          \`\`\`
          cd /path/to/your/project
          nexus scan           # index it and set a baseline
          nexus rescan         # what changed, and what it touches
          nexus analyze        # run BugHunter over it
          nexus ask next       # what is worth looking at
          \`\`\`

          Linux binaries are statically linked against musl and run on any distribution.
          Every asset's SHA-256 is in \`checksums.txt\`; the installer refuses to install
          a binary whose checksum does not match.

          The installer places two binaries: \`nexus\`, the platform, and \`bughunter\`, its first
          capability's own CLI.

          **Working:** scan, rescan, impact, graph, analyze, findings, ask, facts, and an MCP
          server; Java, TypeScript and GraphQL; the dependency graph and the cross-stack seam.

          **Not yet:** the verification engine — nothing is proven by reproduction — and the
          Python and Rust analyzers. See [docs/roadmap.md](docs/roadmap.md)."
          fi
