name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The benchmark analysis' own statistics self-test: medians not means, a paired bootstrap
      # that resamples tasks, the two task sets, the fallback counter. Pure stdlib and ~0.2s, and
      # nothing else in CI ran it — so `make check` was vacuous for the one file a ship-or-delete
      # decision is read from. Before the tests, so a broken statistic fails in the first second.
      - name: Benchmark analysis self-test
        run: python3 scripts/eval/analyse.py --self-test

      # The architecture's module boundaries are tests, not conventions:
      # docs/architecture.md §4. They run with everything else.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Smoke-test against a real repository
        run: |
          set -eu
          cargo build --release --locked
          bh="$PWD/target/release/nexus"
          repo=$(mktemp -d)
          out=$(mktemp -d)
          git clone --depth 1 https://github.com/spring-projects/spring-petclinic.git "$repo" >/dev/null 2>&1

          # Reports are written outside the scanned repository. Writing them inside makes
          # the next rescan correctly report them as new files, which looks like a bug in
          # the cascade and is a bug in the harness.
          "$bh" --project "$repo" scan   --json > "$out/scan.json"
          "$bh" --project "$repo" rescan --json > "$out/rescan.json"
          "$bh" --project "$repo" graph
          "$bh" --project "$repo" doctor || true

          # A no-op rescan must report no changes. This is the assertion that the
          # incremental cascade actually works, and it is cheap enough to run per commit.
          python3 "$GITHUB_WORKSPACE/scripts/check_smoke.py" "$out/scan.json" "$out/rescan.json"

      # The tokio clone is the expensive part and tokio_fixture.sh reuses an existing one, so
      # cache it. Keyed on the corpus description purely as a cheap invalidation — a stale
      # clone can never be scored against the wrong commits, because tokio_fixture.sh replays
      # every start state on each invocation. Correctness comes from that idempotent replay,
      # not from this key.
      - name: Cache the tokio corpus
        uses: actions/cache@v4
        with:
          path: target/fixtures/tokio
          key: tokio-corpus-${{ hashFiles('tests/fixtures/corpora/tokio/fixture.toml', 'scripts/eval/tokio_fixture.sh') }}

      # The retrieval oracle: free, deterministic, and the question run 20260907T093144Z
      # answered for $28.88. Not in `make check` because it needs the corpus above.
      - name: Retrieval oracle on tokio
        run: make tier1-retrieval
