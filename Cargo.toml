[workspace]
resolver = "2"
members = [
  "crates/bh-types",
  "crates/bh-store",
  "crates/bh-vcs",
  "crates/bh-lang",
  "crates/bh-lang-java",
  "crates/bh-lang-ts",
  "crates/bh-lang-graphql",
  "crates/bh-core",
  "crates/bh-mcp",
  "crates/bh-cli",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/zorigtbaatarAst/bughunter"
rust-version = "1.82"

[workspace.dependencies]
bh-types     = { path = "crates/bh-types" }
bh-store     = { path = "crates/bh-store" }
bh-vcs       = { path = "crates/bh-vcs" }
bh-lang      = { path = "crates/bh-lang" }
bh-lang-java = { path = "crates/bh-lang-java" }
bh-lang-ts   = { path = "crates/bh-lang-ts" }
bh-lang-graphql = { path = "crates/bh-lang-graphql" }
bh-core      = { path = "crates/bh-core" }
bh-mcp       = { path = "crates/bh-mcp" }

anyhow    = "1"
blake3    = "1.8"
clap      = { version = "4", features = ["derive", "env"] }
git2      = { version = "0.20", default-features = false }
ignore    = "0.4"
rayon     = "1.10"
rusqlite  = { version = "0.40", features = ["bundled"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml      = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
