[workspace]
resolver = "2"
members = [
  "crates/nexus-types",
  "crates/nexus-store",
  "crates/nexus-vcs",
  "crates/nexus-lang",
  "crates/nexus-lang-java",
  "crates/nexus-lang-ts",
  "crates/nexus-lang-graphql",
  "crates/nexus-lang-rust",
  "crates/nexus-lang-python",
  "crates/nexus-lang-pack",
  "crates/nexus-core",
  "crates/cap-bughunter",
  "crates/cap-architect",
  "crates/cap-review",
  "crates/nexus-verify",
  "crates/nexus-mcp",
  "crates/nexus-fixtures",
  "crates/nexus-cli",
]

[workspace.package]
version    = "0.3.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/zorigtbaatarAst/nexus"
rust-version = "1.82"

[workspace.dependencies]
nexus-types     = { path = "crates/nexus-types" }
nexus-store     = { path = "crates/nexus-store" }
nexus-vcs       = { path = "crates/nexus-vcs" }
nexus-lang      = { path = "crates/nexus-lang" }
nexus-lang-java = { path = "crates/nexus-lang-java" }
nexus-lang-ts   = { path = "crates/nexus-lang-ts" }
nexus-lang-graphql = { path = "crates/nexus-lang-graphql" }
nexus-lang-rust = { path = "crates/nexus-lang-rust" }
nexus-lang-python = { path = "crates/nexus-lang-python" }
nexus-lang-pack = { path = "crates/nexus-lang-pack" }
nexus-core      = { path = "crates/nexus-core" }
cap-bughunter   = { path = "crates/cap-bughunter" }
cap-architect   = { path = "crates/cap-architect" }
cap-review      = { path = "crates/cap-review" }
nexus-verify    = { path = "crates/nexus-verify" }
nexus-mcp       = { path = "crates/nexus-mcp" }
nexus-fixtures  = { path = "crates/nexus-fixtures" }

anyhow    = "1"
blake3    = "1.8"
clap      = { version = "4", features = ["derive", "env"] }
git2      = { version = "0.20", default-features = false }
ignore    = "0.4"
rayon     = "1.10"
rusqlite  = { version = "0.40", features = ["bundled"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml      = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
