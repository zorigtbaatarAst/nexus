# next-storefront — the cross-stack fixture.
#
# Backend and frontend live in **one repository** on purpose. Family B asks whether a change
# to a backend contract reaches the React components that render it, and that question only
# exists inside a single indexed project: split across two repos there is no seam to cross,
# only two scans that never meet.
#
# The edge under test is invisible in the source text. Nothing in `orders.ts` names
# `OrderController`; the two sides agree only because both were generated against
# `order.graphqls`. Indexing that schema is what makes the connection findable.

[fixture]
name        = "next-storefront"
description = "Spring GraphQL API and a Next.js frontend in one repository, joined only by a schema."
stack       = ["java", "spring", "graphql", "typescript", "next"]
role        = "realistic-fullstack"
base_epoch        = 1738368000   # 2025-02-01T00:00:00Z
commit_interval_s = 86400

[author]
name  = "Nexus Fixtures"
email = "fixtures@nexus.invalid"

[[commit]]
id      = "c1"
message = "Orders API and the storefront that renders it"
write = [
  { path = ".gitignore",                                         blob = "gitignore" },
  { path = "api/pom.xml",                                        blob = "api-pom.xml" },
  { path = "api/src/main/java/mn/shop/api/Order.java",           blob = "Order.java" },
  { path = "api/src/main/java/mn/shop/api/OrderDto.java",        blob = "OrderDto.java" },
  { path = "api/src/main/java/mn/shop/api/OrderRepository.java", blob = "OrderRepository.java" },
  { path = "api/src/main/java/mn/shop/api/OrderController.java", blob = "OrderController.java" },
  { path = "api/src/main/resources/graphql/order.graphqls",      blob = "order.graphqls" },
  { path = "api/src/test/java/mn/shop/api/OrderDtoTest.java",    blob = "OrderDtoTest.java" },
  { path = "web/package.json",                                   blob = "package.json" },
  { path = "web/package-lock.json",                              blob = "package-lock.json" },
  { path = "web/tsconfig.json",                                  blob = "tsconfig.json" },
  { path = "web/src/lib/orders.ts",                              blob = "orders.ts" },
  { path = "web/src/lib/orders.test.ts",                         blob = "orders.test.ts" },
  { path = "web/src/components/OrderSummary.tsx",                blob = "OrderSummary.tsx" },
  { path = "web/src/app/orders/page.tsx",                        blob = "page.tsx" },
  { path = "web/src/generated/graphql-generated.ts",             blob = "graphql-generated.ts" },
]
expect.note = """
`web/src/generated/graphql-generated.ts` is codegen output. `walk::is_excluded` must drop it: \
it is symbols nobody wrote and nobody can change, and indexing them inflates every count and \
every impact answer with edges no edit can follow.

Two builds, not one, and that is the point: `api/pom.xml` compiles the Java, `web/` type-checks \
the TypeScript, and neither sees the other. A single build spanning both would repair the seam \
that Family B exists to measure.

`web`'s build script is `tsc --noEmit` rather than `next build`. The TypeScript compiler is \
what actually compiles these sources and what a broken rename fails; `next build` would need a \
root layout and a Next scaffold nobody wrote, and would put a bundler's network reach inside an \
offline benchmark run."""

[[commit]]
id      = "c2"
message = "Show the settled total on the orders page"
write = [
  { path = "web/src/components/OrderSummary.tsx", blob = "OrderSummary.tsx" },
]
expect.new_findings = 0

# --- c3 · the contract moves on one side only ----------------------------------------------

[[commit]]
id      = "c3"
message = "Rename Order.totalAmount to grossAmount for the tax rework"
write = [
  { path = "api/src/main/java/mn/shop/api/Order.java",    blob = "Order-renamed.java" },
  { path = "api/src/main/java/mn/shop/api/OrderDto.java", blob = "OrderDto-renamed.java" },
]
plants_bug.id      = "orphaned-total-amount-field"
plants_bug.kind    = "contract"
plants_bug.summary = """
The Java side renames the field. `order.graphqls` still declares `totalAmount`, the query in \
`orders.ts` still selects it, and `OrderSummary.tsx` still reads it. Java compiles. TypeScript \
compiles. The page renders `NaN`. Neither compiler can see across the seam, and the schema — \
which both sides were generated from — is the only place the disagreement is visible."""
plants_bug.anchor = "api/src/main/resources/graphql/order.graphqls:4"

# --- c4 · the API finishes the rename and the storefront does not --------------------------

[[commit]]
id      = "c4"
message = "Finish the tax rework: the accessor and the schema publish grossAmount"
write = [
  { path = "api/src/main/java/mn/shop/api/Order.java",      blob = "Order-gross.java" },
  { path = "api/src/main/java/mn/shop/api/OrderDto.java",   blob = "OrderDto-gross.java" },
  { path = "api/src/main/resources/graphql/order.graphqls", blob = "order-renamed.graphqls" },
]
plants_bug.id      = "storefront-queries-a-retired-field"
plants_bug.kind    = "contract"
plants_bug.summary = """
`api/` is now internally consistent: entity, accessor, DTO and schema all say `grossAmount`, \
and nothing inside that tree is wrong. c3's half-rename — `getTotalAmount()` still standing \
beside a `grossAmount` field, the leftover B1's hidden test grades red — is finished here too, \
which is what makes the claim literal: no file under `api/` names `totalAmount` in any casing. \
The storefront was never told. `orders.ts` still selects \
`totalAmount`, `OrderSummary.tsx` still reads it, and the client-side `Order` interface still \
declares it — so `tsc --noEmit` is green too. The orders query names a field the schema no \
longer declares, and the page fails on the response it gets back. There is no file on either \
side of the seam that is wrong *by itself*: only the pair is."""
plants_bug.anchor = "web/src/lib/orders.ts:6"
expect.note = """
This retires c3's orphan by removing the declaration nobody served, and it is deliberately not \
recorded as c3's `fixed_by`: the contract still disagrees with its only client afterwards. The \
disagreement moved across the seam, it was not repaired.

c3 stays as it is because it is the corpus's only orphaned-GraphQL-field instance — \
`crates/nexus-core/tests/debug_supply.rs` measures the debug package against it, and \
cap-bughunter's `graphql:orphan-field` rule is what it is a specimen of. B2 starts from c4 \
rather than c3 for a reason recorded on the task itself."""

[[patch]]
id          = "wip-status-filter"
blob        = "wip-status-filter.patch"
base        = "c2"
description = "A half-written change to the total, uncommitted, as an agent finds a workspace."

[[task]]
id      = "B1-rename-crosses-the-seam"
family  = "B"
commit  = "c2"
prompt  = "Rename the `totalAmount` field on Order to `grossAmount` throughout."
required_sites = [
  "api/src/main/java/mn/shop/api/Order.java",
  "api/src/main/java/mn/shop/api/OrderDto.java",
  "api/src/main/resources/graphql/order.graphqls",
  "web/src/lib/orders.ts",
  "web/src/components/OrderSummary.tsx",
]
hidden_tests = ["tests/eval/hidden/B1"]
note = """
Five sites in three languages. The two frontend sites are reachable only through the schema; \
an agent that greps for `totalAmount` finds them, but an agent that reasons about "the Java \
files I need to change" does not. The generated file is deliberately excluded from \
required_sites — editing it is wrong, because the next build overwrites it.

**Known not to discriminate, and deliberately left alone.** In the 20260906T131608Z sweep the \
control arm found all five sites five times out of five. It is one grep: the prompt quotes \
`totalAmount` and all five sites spell it identically. No prompt wording changes that. The \
fixture change that would — making the schema and the storefront name the field something \
other than `totalAmount`, so the link is a schema binding rather than a shared literal — \
cannot be made fair here, because `tests/eval/hidden/B1` asks for `grossAmount` in the schema \
and in both frontend files. Under any divergent spelling the agent has to *guess* that \
"rename `totalAmount` throughout" reaches an identifier the prompt never names, and the task \
stops measuring cross-file reach and starts measuring a scope guess. Whether B1 stays in the \
corpus is a question for the control-arm validation, not for a rewrite of this fixture."""

[[task]]
id      = "B2-orphaned-field-diagnosis"
family  = "B"
commit  = "c4"
prompt  = "The orders page is broken — it throws instead of rendering the total for each order. Find out why and fix it."
required_sites = [
  "web/src/lib/orders.ts",
  "web/src/components/OrderSummary.tsx",
]
hidden_tests = ["tests/eval/hidden/B2"]
note = """
The symptom is in TypeScript; the cause is a rename in Java that the schema has already \
followed and the storefront has not.

**This task started from c3 and was moved to c4 after the 20260906T131608Z sweep**, where the \
control arm — an agent with no tooling of any kind — passed it five times out of five while \
touching none of the three sites the task declared. From c3 the whole disagreement is visible \
inside `api/`: the schema declares `totalAmount` and `OrderDto` publishes `grossAmount`, so \
renaming one record component back turns all three hidden assertions green without opening \
`web/` at all. That is not a defect in the hidden test — it grades agreement across the chain \
and a revert is genuine agreement — it is a fixture that put a fully-specified copy of the \
contract on the same side of the seam as the bug.

From c4 there is nothing wrong inside `api/` to find. The disagreement cannot be observed, let \
alone repaired, without reading a file on each side. The two `web/` sites are what a fix \
touches; an alias (`totalAmount: grossAmount`) in the query is a fix that touches only the \
first, which is why L3 reports rather than gates.

The prompt was reworded with the start state, not for difficulty. "Shows NaN" describes one \
situation only — a query that is *valid* against the schema resolving to no value — and that \
requires the schema to declare a field nothing serves, which is the `api/`-internal orphan \
that made the task locally solvable in the first place. At c4 the query names a field the \
schema does not declare, so it is rejected outright and `data.orders` throws. The wording \
names no file, no field and no side of the seam, exactly as the old one did."""

[[task]]
id      = "N2-copy-tweak"
family  = "N"
commit  = "c2"
prompt  = "The orders page heading says 'Orders'. Change it to 'Your orders'."
required_sites = ["web/src/components/OrderSummary.tsx"]
hidden_tests = ["tests/eval/hidden/N2"]
note = "One string, one file. Nexus has nothing to add; gate T5 says it must also cost nothing."
